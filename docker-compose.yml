version: '3.8'
services:
  flask-app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: flask-container
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  health-app:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: health-container
    ports:
      - "8080:8080"
    restart: always
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "1", "--timeout", "30", "health_app:health_app"]

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - /opt/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/logs/nginx:/var/log/nginx
    depends_on:
      health-app:
        condition: service_healthy
    restart: always
    logging:
      driver: "none"